name: QuartzRacer APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Forráskód letöltése a repóból
      uses: actions/checkout@v4

    - name: Java 17 környezet beállítása és gyorsítótárazás
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle' # Mivel megírtuk a gradlew-et, a gyorsítótár most már tökéletesen működik és felgyorsítja a buildet!

    - name: Gradle futtatási jog megadása
      run: chmod +x gradlew

    - name: Automatikus APK lefordítása a TOML katalógus alapján
      run: ./gradlew assembleDebug

    - name: Kész APK kimentése letölthető Artifact-ként
      uses: actions/upload-artifact@v4
      with:
        name: QuartzRacer-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
