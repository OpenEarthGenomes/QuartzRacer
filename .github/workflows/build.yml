name: QuartzRacer APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Forráskód letöltése a repóból
      uses: actions/checkout@v4

    - name: Java 17 környezet beállítása
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Gradle Wrapper ellenőrzése és automatikus generálása ha hiányzik
      run: |
        if [ ! -f gradlew ]; then
          echo "A gradlew fájl nem található! A GitHub most automatikusan létrehozza..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Automatikus APK lefordítása a TOML katalógus alapján
      run: ./gradlew assembleDebug

    - name: Kész APK kimentése letölthető Artifact-ként
      uses: actions/upload-artifact@v4
      with:
        name: QuartzRacer-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

